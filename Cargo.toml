[package]
name = "chip8"
version = "0.1.0"
edition = "2024"


[dependencies]
raylib = "5.5.1"
rand = "0.8"
cstr = "0.2"

[profile.release]
opt-level = 2
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.x86_64-unknown-linux-gnu]
linker = "gcc"
